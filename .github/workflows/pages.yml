name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone page
        run: |
          cp public/nock.html "$RUNNER_TEMP/nock.html"
          if ! node scripts/build-standalone.mjs; then
            echo "Standalone build failed; falling back to committed public/nock.html"
            cp "$RUNNER_TEMP/nock.html" public/nock.html
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp public/nock.html _site/index.html
          cp public/favicon.svg public/og.png public/icon-1024.png public/icon-512.png public/icon-192.png public/apple-touch-icon.png _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
